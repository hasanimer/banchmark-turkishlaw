# Test edilen sistemler. Her sistem, aynı ajana (aynı model, istem, bütçe) verilen bir araç kümesidir.
# Gizli anahtarlar yalnız ortam değişkenlerinden okunur (.env); bu dosyaya yazılmaz.
#
# kind:
#   mcp_http              Uzak MCP sunucusu (Streamable HTTP)
#   mcp_stdio             Yerelde süreç olarak çalışan MCP sunucusu
#   anthropic_web_search  Genel web araması baz çizgisi (Anthropic sunucu tarafı aracı)
#   none                  Kapalı kitap (araç yok)
#
# exclude_tools: araştırma dışı (belge üretimi vb.) araçlar bütün sistemlerde aynı ilkeyle çıkarılır.

systems:
  legaluga:
    label: "Legaluga MCP"
    kind: mcp_http
    url: "${LEGALUGA_MCP_URL:-https://mcp.legaluga.com/mcp}"
    headers:
      Authorization: "Bearer ${LEGALUGA_MCP_TOKEN}"
    exclude_tools: ["udf_*", "dilekce_*", "imar_*"]
    # Legaluga Core'un semantik araması eşzamanlı çağrıları sınırlıyor.
    max_concurrency: 1

  yargi_mcp:
    label: "Yargı MCP (açık kaynak, yerel)"
    kind: mcp_stdio
    command: "${YARGI_MCP_COMMAND:-yargi-mcp}"
    exclude_tools: []
    max_concurrency: 1

  legal_data_hunter:
    label: "Legal Data Hunter"
    kind: mcp_http
    url: "${LDH_MCP_URL}"
    headers:
      Authorization: "Bearer ${LDH_API_KEY}"
    exclude_tools: ["report_source_issue"]

  web_search:
    label: "Genel web araması (baz çizgisi)"
    kind: anthropic_web_search
    max_uses: 10

  closed_book:
    label: "Kapalı kitap (araçsız)"
    kind: none
