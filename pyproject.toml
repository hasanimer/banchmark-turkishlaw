[project]
name = "legaluga-law-benchmark"
version = "0.1.0"
description = "Türk hukuku araştırma araçlarını (MCP) aynı yapay zekâ ajanı üzerinden karşılaştıran benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
yargi = ["yargi-mcp"]

[project.scripts]
lbench = "legaluga_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legaluga_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
